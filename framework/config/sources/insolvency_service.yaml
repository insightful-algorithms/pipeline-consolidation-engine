# Insolvency Service — Individual Insolvency Statistics (Long-Run Series)
# Scope: England & Wales, monthly grain, 30 indicators.
# Northern Ireland, authorising-body breakdown, and IVA Outcomes are
# separate data products with different grains -- added in a follow-up
# config extension, not here.
#
# column_mapping below was GENERATED from the publisher's own metadata
# file (framework/config/generate_insolvency_config.py), not hand-typed --
# a genuine example of a metadata-driven pipeline, not just the name.

source_publisher: INSOLVENCY_SERVICE

files:
  - path: "bronze/insolvency_service/Long-Run_Series_in_CSV_Format_-_Individual_Insolvency_Statistics_October_2024.csv"
    format: csv
  - path: "bronze/insolvency_service/Long-Run_Series_in_CSV_Format_-_Individual_Insolvency_Statistics_December_2025.csv"
    format: csv
  - path: "bronze/insolvency_service/Long-Run_Series_in_CSV_Format_-_Individual_Insolvency_Statistics_July_2026.csv"
    format: csv

period_grain: MONTH

column_mapping:
